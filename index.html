<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz cumpleaños, Ale 💙</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #071a35, #123d68, #0a223f);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 25px;
    }

    .portada {
      max-width: 500px;
      width: 100%;
      padding: 30px 20px;
    }

    .foto {
      width: 210px;
      height: 210px;
      object-fit: cover;
      border-radius: 50%;
      border: 5px solid white;
      box-shadow: 0 0 30px rgba(255,255,255,0.25);
      margin-bottom: 25px;
    }

    h1 {
      font-size: 42px;
      margin: 10px 0;
    }

    h2 {
      font-size: 22px;
      font-weight: normal;
      line-height: 1.5;
      margin: 15px 0;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    button {
      margin-top: 25px;
      padding: 15px 30px;
      border: none;
      border-radius: 30px;
      background: white;
      color: #123d68;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.96);
    }
  </style>
</head>

<body>

  <div class="portada">

    <img src="foto-ale.jpg" alt="Ale de pequeño" class="foto">

    <h1>ALE 💙</h1>

    <h2>
      Hoy es un día especial…<br>
      porque hoy celebramos tus 16 años.
    </h2>

    <p>
      Hay algo preparado especialmente para ti. 🎁
    </p>

    <button onclick="abrirSorpresa()">
    ABRIR 🎁
</button>

  </div>

</body>
</html>
